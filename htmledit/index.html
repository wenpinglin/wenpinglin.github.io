<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可视化 HTML 在线编辑器</title>
    <style>
        :root {
            --bg: #f4f5f7;
            --surface: #ffffff;
            --border: #e4e7ed;
            --text: #2c3e50;
            --text-secondary: #606266;
            --primary: #4f46e5;
            --primary-light: #eef2ff;
            --primary-hover: #4338ca;
            --shadow: 0 2px 12px rgba(0,0,0,0.04);
            --radius: 10px;
            --radius-sm: 6px;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            --editor-bg: #ffffff;
            --toolbar-bg: #fafbfc;
            --status-bg: #fafbfc;
            --divider-color: #e4e7ed;
        }
        .dark {
            --bg: #12141a;
            --surface: #1c1e26;
            --border: #2d3040;
            --text: #e0e3eb;
            --text-secondary: #a0a4b8;
            --primary: #818cf8;
            --primary-light: #1e1f3a;
            --primary-hover: #6366f1;
            --editor-bg: #1c1e26;
            --toolbar-bg: #22242e;
            --status-bg: #22242e;
            --divider-color: #2d3040;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
        }
        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }
        /* 工具栏 */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            z-index: 10;
            box-shadow: var(--shadow);
            flex-shrink: 0;
        }
        .tool-group { display: flex; align-items: center; gap: 4px; }
        .tool-divider { width: 1px; height: 22px; background: var(--border); margin: 0 6px; }
        .btn {
            background: transparent;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
            color: var(--text);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-family: var(--font);
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn:hover { background: var(--primary-light); border-color: var(--primary); }
        .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-icon { padding: 6px; min-width: 34px; justify-content: center; }
        .select-style {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 5px 10px;
            font-size: 13px;
            color: var(--text);
            font-family: var(--font);
            cursor: pointer;
        }
        /* 主内容区 */
        .main-content {
            display: flex;
            flex: 1;
            min-height: 0;
            background: var(--bg);
        }
        .pane {
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--editor-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            margin: 8px;
            flex: 1 1 50%; /* 默认各占一半 */
        }
        .pane-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            background: var(--toolbar-bg);
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }
        .visual-editor-container {
            flex: 1;
            overflow: hidden;
        }
        .visual-editor-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
        .source-editor-container {
            flex: 1;
            overflow: hidden;
        }
        .source-textarea {
            width: 100%;
            height: 100%;
            background: var(--editor-bg);
            color: var(--text);
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 14px;
            padding: 12px;
            border: none;
            resize: none;
            outline: none;
            line-height: 1.6;
        }
        /* 分隔条 */
        .divider {
            width: 10px;
            background: transparent;
            cursor: col-resize;
            flex-shrink: 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .divider::after {
            content: '';
            width: 4px;
            height: 56px;
            background: var(--divider-color);
            border-radius: 2px;
            transition: background 0.2s;
        }
        .divider:hover { background: rgba(79,70,229,0.05); }
        .divider:hover::after { background: var(--primary); }
        /* 状态栏 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 16px;
            background: var(--status-bg);
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            background: #1f2937;
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.15);
            animation: toastIn 0.3s, toastOut 0.3s 2.4s forwards;
            pointer-events: auto;
        }
        @keyframes toastIn { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
        @keyframes toastOut { from{opacity:1;} to{opacity:0;transform:translateY(-8px);} }
        /* 响应式 */
        @media (max-width: 768px) {
            .main-content { flex-direction: column; }
            .divider { width: 100%; height: 10px; cursor: row-resize; }
            .divider::after { width: 56px; height: 4px; }
            .pane { flex: 1 1 auto; margin: 4px; }
        }
    </style>
</head>
<body>
<div id="app">
    <!-- 工具栏 -->
    <div class="toolbar">
        <div class="tool-group">
            <button class="btn btn-primary" id="btn-upload">📂 上传</button>
            <button class="btn" id="btn-download">💾 下载</button>
            <button class="btn btn-icon" id="btn-source-toggle" title="显示/隐藏源码面板">📝</button>
        </div>
        <span class="tool-divider"></span>
        <div class="tool-group" id="rich-toolbar">
            <button class="btn btn-icon" data-cmd="bold" title="加粗"><b>B</b></button>
            <button class="btn btn-icon" data-cmd="italic" title="斜体"><i>I</i></button>
            <button class="btn btn-icon" data-cmd="underline" title="下划线"><u>U</u></button>
            <button class="btn btn-icon" data-cmd="strikeThrough" title="删除线"><s>S</s></button>
            <span class="tool-divider"></span>
            <select class="select-style" id="format-block">
                <option value="p">段落</option>
                <option value="h1">标题 1</option>
                <option value="h2">标题 2</option>
                <option value="h3">标题 3</option>
                <option value="pre">预格式化</option>
            </select>
            <button class="btn btn-icon" data-cmd="insertUnorderedList" title="无序列表">•≡</button>
            <button class="btn btn-icon" data-cmd="insertOrderedList" title="有序列表">1.</button>
            <span class="tool-divider"></span>
            <button class="btn btn-icon" data-cmd="createLink" title="插入链接">🔗</button>
            <button class="btn btn-icon" id="btn-insert-image" title="插入图片">🖼️</button>
            <span class="tool-divider"></span>
            <button class="btn btn-icon" data-cmd="undo" title="撤销">↩️</button>
            <button class="btn btn-icon" data-cmd="redo" title="重做">↪️</button>
            <button class="btn btn-icon" data-cmd="removeFormat" title="清除格式">🧹</button>
        </div>
        <div style="flex:1;"></div>
        <button class="btn btn-icon" id="btn-theme" title="切换暗色模式">🌓</button>
    </div>

    <!-- 主编辑区 -->
    <div class="main-content" id="main-content">
        <div class="pane" id="pane-visual">
            <div class="pane-header">
                <span>✏️ 可视化编辑</span>
                <button class="btn btn-icon" id="btn-refresh-visual" title="从源码刷新">🔄</button>
            </div>
            <div class="visual-editor-container">
                <iframe id="visual-iframe" sandbox="allow-same-origin" title="可视化编辑区"></iframe>
            </div>
        </div>
        <div class="divider" id="divider"></div>
        <div class="pane" id="pane-source">
            <div class="pane-header">
                <span>📄 源代码</span>
                <button class="btn btn-icon" id="btn-apply-source" title="应用源码">✅</button>
            </div>
            <div class="source-editor-container">
                <textarea class="source-textarea" id="source-textarea" spellcheck="false"></textarea>
            </div>
        </div>
    </div>

    <div class="status-bar">
        <span id="status-text">就绪</span>
        <span id="status-file">文件: index.html</span>
    </div>
</div>
<input type="file" id="file-input" accept=".html,.htm" style="display:none;">
<div class="toast-container" id="toast-container"></div>

<script>
(function() {
    let currentFileName = 'index.html';
    let isSourceVisible = true;
    let isDark = false;
    let visualObserver = null;

    const visualIframe = document.getElementById('visual-iframe');
    const sourceTextarea = document.getElementById('source-textarea');
    const paneVisual = document.getElementById('pane-visual');
    const paneSource = document.getElementById('pane-source');
    const mainContent = document.getElementById('main-content');
    const divider = document.getElementById('divider');
    const toastContainer = document.getElementById('toast-container');
    const fileInput = document.getElementById('file-input');
    const statusText = document.getElementById('status-text');
    const statusFile = document.getElementById('status-file');
    const btnUpload = document.getElementById('btn-upload');
    const btnDownload = document.getElementById('btn-download');
    const btnSourceToggle = document.getElementById('btn-source-toggle');
    const btnApplySource = document.getElementById('btn-apply-source');
    const btnRefreshVisual = document.getElementById('btn-refresh-visual');
    const richToolbar = document.getElementById('rich-toolbar');
    const formatBlock = document.getElementById('format-block');
    const btnInsertImage = document.getElementById('btn-insert-image');
    const btnTheme = document.getElementById('btn-theme');

    const defaultHTML = `<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>欢迎编辑</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; color: #333; }
h1 { color: #4f46e5; }
.card { background: #f0f4ff; border-radius: 12px; padding: 24px; margin: 20px 0; }
</style></head>
<body>
<h1>👋 欢迎使用可视化编辑器</h1>
<p>这是一段可以<strong>直接点击修改</strong>的文字。选中文字后，用上面的工具栏调整格式。</p>
<div class="card">
<h2>📌 操作提示</h2>
<ul>
<li>点击文字即可编辑</li>
<li>选中文字点 <b>B</b> 加粗</li>
<li>点击 🖼️ 按钮插入图片</li>
<li>右侧源代码会实时更新</li>
</ul>
</div>
<p>尽情修改吧！ 😊</p>
</body></html>`;

    function stripScripts(html) {
        const div = document.createElement('div');
        div.innerHTML = html;
        div.querySelectorAll('script').forEach(s => s.remove());
        return div.innerHTML;
    }

    function loadVisualContent(html) {
        const clean = stripScripts(html);
        const doc = visualIframe.contentDocument || visualIframe.contentWindow.document;
        doc.open();
        doc.write(clean);
        doc.close();
        doc.designMode = 'on';
        observeVisualChanges(doc);
        syncSourceFromVisual();
    }

    function observeVisualChanges(doc) {
        if (visualObserver) visualObserver.disconnect();
        visualObserver = new MutationObserver(() => syncSourceFromVisual());
        visualObserver.observe(doc.body, {
            childList: true,
            subtree: true,
            characterData: true,
            attributes: true
        });
        doc.body.addEventListener('input', () => syncSourceFromVisual());
    }

    function syncSourceFromVisual() {
        const doc = visualIframe.contentDocument || visualIframe.contentWindow.document;
        if (!doc?.documentElement) return;
        sourceTextarea.value = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
        updateStatus();
    }

    function applySourceToVisual() {
        loadVisualContent(sourceTextarea.value);
        showToast('✅ 源码已应用');
    }

    richToolbar.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        const cmd = btn.dataset.cmd;
        if (!cmd) return;
        visualIframe.contentWindow.focus();
        const doc = visualIframe.contentDocument;
        if (cmd === 'createLink') {
            const url = prompt('输入链接地址 (https://...)', 'https://');
            if (url) doc.execCommand('createLink', false, url);
            return;
        }
        doc.execCommand(cmd, false, null);
        syncSourceFromVisual();
    });

    formatBlock.addEventListener('change', () => {
        visualIframe.contentWindow.focus();
        visualIframe.contentDocument.execCommand('formatBlock', false, formatBlock.value);
        syncSourceFromVisual();
    });

    btnInsertImage.addEventListener('click', () => {
        const url = prompt('输入图片地址 (https://...)', 'https://');
        if (url) {
            visualIframe.contentWindow.focus();
            visualIframe.contentDocument.execCommand('insertImage', false, url);
            syncSourceFromVisual();
        }
    });

    visualIframe.addEventListener('load', () => {
        const doc = visualIframe.contentDocument || visualIframe.contentWindow.document;
        doc.addEventListener('paste', (e) => {
            const items = e.clipboardData?.items;
            if (items) {
                for (let item of items) {
                    if (item.type.indexOf('image') !== -1) {
                        e.preventDefault();
                        const blob = item.getAsFile();
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            doc.execCommand('insertImage', false, ev.target.result);
                            syncSourceFromVisual();
                        };
                        reader.readAsDataURL(blob);
                        break;
                    }
                }
            }
        });
    });

    function handleFileUpload(file) {
        if (!file) return;
        if (!file.name.match(/\.html?$/i)) {
            showToast('⚠️ 请上传 .html 或 .htm 文件');
            return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
            currentFileName = file.name;
            statusFile.textContent = '文件: ' + file.name;
            loadVisualContent(e.target.result);
            sourceTextarea.value = e.target.result;
            showToast('✅ 已加载: ' + file.name);
        };
        reader.onerror = () => showToast('❌ 文件读取失败');
        reader.readAsText(file);
    }

    btnUpload.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
        handleFileUpload(e.target.files[0]);
        fileInput.value = '';
    });

    document.addEventListener('dragover', e => e.preventDefault());
    document.addEventListener('drop', e => {
        e.preventDefault();
        const file = e.dataTransfer.files[0];
        if (file) handleFileUpload(file);
    });

    btnDownload.addEventListener('click', () => {
        const html = sourceTextarea.value || visualIframe.contentDocument?.documentElement?.outerHTML || '';
        const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = currentFileName;
        a.click();
        URL.revokeObjectURL(a.href);
        showToast('📥 已下载');
    });

    btnSourceToggle.addEventListener('click', () => {
        isSourceVisible = !isSourceVisible;
        paneSource.style.display = isSourceVisible ? 'flex' : 'none';
        divider.style.display = isSourceVisible ? '' : 'none';
        // 恢复弹性布局
        paneVisual.style.flex = '';
        showToast(isSourceVisible ? '源码面板已显示' : '源码面板已隐藏');
    });

    btnApplySource.addEventListener('click', applySourceToVisual);
    btnRefreshVisual.addEventListener('click', () => {
        if (confirm('从源码刷新会丢失可视化编辑中的修改，确定吗？')) {
            applySourceToVisual();
        }
    });

    // ---------- 分隔条拖拽（百分比模式） ----------
    let isDragging = false;
    divider.addEventListener('mousedown', (e) => {
        isDragging = true;
        document.body.style.cursor = 'col-resize';
        e.preventDefault();
    });
    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const rect = mainContent.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const totalWidth = rect.width - divider.offsetWidth;
        let leftPercent = (x / totalWidth) * 100;
        leftPercent = Math.min(Math.max(leftPercent, 20), 80); // 限制20%~80%
        paneVisual.style.flex = `0 0 ${leftPercent}%`;
        paneSource.style.flex = '1';
    });
    window.addEventListener('mouseup', () => {
        if (isDragging) {
            isDragging = false;
            document.body.style.cursor = '';
        }
    });
    // 窗口大小变化时重置为各半
    window.addEventListener('resize', () => {
        if (!isDragging) {
            paneVisual.style.flex = '';
            paneSource.style.flex = '';
        }
    });

    // 主题切换
    function applyTheme() {
        document.body.classList.toggle('dark', isDark);
        localStorage.setItem('visual-editor-dark', isDark ? '1' : '0');
    }
    btnTheme.addEventListener('click', () => {
        isDark = !isDark;
        applyTheme();
    });
    if (localStorage.getItem('visual-editor-dark') === '1' ||
        window.matchMedia('(prefers-color-scheme: dark)').matches) {
        isDark = true;
        applyTheme();
    }

    function showToast(msg) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = msg;
        toastContainer.appendChild(toast);
        setTimeout(() => toast.remove(), 2800);
    }

    function updateStatus() {
        statusText.textContent = '已修改';
        clearTimeout(window.statusTimer);
        window.statusTimer = setTimeout(() => { statusText.textContent = '就绪'; }, 1000);
    }

    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
            e.preventDefault();
            btnDownload.click();
        }
    });

    // 启动
    loadVisualContent(defaultHTML);
    sourceTextarea.value = defaultHTML;
    statusFile.textContent = '文件: index.html';
})();
</script>
</body>
</html>
